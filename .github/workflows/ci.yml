name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Validate MCPB manifest
        run: npx -y @anthropic-ai/mcpb validate manifest.json

      - name: Check registry metadata matches package.json
        run: |
          test "$(jq -r .mcpName package.json)" = "$(jq -r .name server.json)"
          test "$(jq -r .name package.json)" = "$(jq -r '.packages[0].identifier' server.json)"
          test "$(jq -r .name package.json)" = "$(jq -r .name manifest.json)"
