version: '3.8'

services:
  testit-mcp-server:
    build: .
    container_name: testit-mcp-server
    environment:
      - TESTIT_URL=${TESTIT_URL:?set TESTIT_URL in .env}
      - TESTIT_TOKEN=${TESTIT_TOKEN}
      - TESTIT_PROJECT_ID=${TESTIT_PROJECT_ID:-}
    restart: unless-stopped
    stdin_open: true
    tty: true

